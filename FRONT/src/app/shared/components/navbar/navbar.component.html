<nav class="navbar">
  <div class="nav-brand">
    <img class="logo" src="/logo.png" alt="WeekyCook logo" />
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-weeky">WEEKY</span><span class="brand-cook">COOK</span>
    </a>
  </div>

  <button
    class="navbar-toggle"
    type="button"
    aria-label="Alternar navegación"
    [attr.aria-expanded]="isMenuOpen()"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="nav-menu" [class.nav-menu--open]="isMenuOpen()">
    <div class="nav-links">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
        >Inicio</a
      >

      <a
        routerLink="/recipes"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
        >Recetas</a
      >

      <a
        routerLink="/planner"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
        >Planificador</a
      >

      <a
        routerLink="/favorites"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
        >Favoritos</a
      >

      @if (authService.isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="active"
          class="nav-link nav-link--admin"
          (click)="closeMenu()"
        >
          Panel Admin
        </a>
      }
    </div>

    <div class="nav-actions">
      @if (!authService.isAuthenticated()) {
        <a
          routerLink="/auth/login"
          class="nav-link nav-link--ghost"
          (click)="closeMenu()"
          >Login</a
        >
        <a
          routerLink="/auth/register"
          class="nav-link nav-link--cta"
          (click)="closeMenu()"
          >Registro</a
        >
      } @else {
        <div class="nav-user">
          <span class="nav-user__name"
            >Hola, {{ authService.currentUser()?.nombre }}</span
          >
          <button
            type="button"
            class="nav-link nav-link--ghost"
            (click)="authService.logout(); closeMenu()"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</nav>
