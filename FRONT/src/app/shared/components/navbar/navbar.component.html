<nav class="navbar">
  <div class="nav-brand">
    <img class="logo" src="/logo.png" alt="WeekyCook logo" />
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-weeky">WEEKY</span><span class="brand-cook">COOK</span>
    </a>
  </div>

  <button
    class="navbar-toggle"
    type="button"
    aria-label="Alternar navegación"
    [attr.aria-expanded]="isMenuOpen()"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="nav-menu" [class.nav-menu--open]="isMenuOpen()">
    <div class="nav-links">
      <a
        routerLink="/recipes"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        <i class="bi bi-journal-text nav-link__icon" aria-hidden="true"></i>
        <span>Recetas</span>
      </a>

      @if (authService.isAuthenticated()) {
        <a
          routerLink="/planner"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()"
        >
          <i class="bi bi-calendar3 nav-link__icon" aria-hidden="true"></i>
          <span>Planificador</span>
        </a>

        <a
          routerLink="/favorites"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()"
        >
          <i class="bi bi-heart nav-link__icon" aria-hidden="true"></i>
          <span>Favoritos</span>
        </a>
      }

      @if (authService.isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="active"
          class="nav-link nav-link--admin"
          (click)="closeMenu()"
        >
          <i class="bi bi-speedometer2 nav-link__icon" aria-hidden="true"></i>
          <span>Panel Admin</span>
        </a>
      }
    </div>

    <div class="nav-actions">
      @if (!authService.isAuthenticated()) {
        <a
          routerLink="/auth/login"
          class="nav-link nav-link--ghost"
          (click)="closeMenu()"
          >Login</a
        >
        <a
          routerLink="/auth/register"
          class="nav-link nav-link--cta"
          (click)="closeMenu()"
          >Registro</a
        >
      } @else {
        <div class="nav-user">
          <span class="nav-user__name"
            >Hola, {{ authService.currentUser()?.nombre }}</span
          >
          <button
            type="button"
            class="nav-link nav-link--ghost"
            (click)="authService.logout(); closeMenu()"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</nav>
