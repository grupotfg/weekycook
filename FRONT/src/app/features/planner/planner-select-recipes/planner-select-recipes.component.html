<section class="planner-wrap">
  <div class="layout-container">
    <div class="planner-shell">
      <h2 class="section-title">Seleccionar recetas</h2>

      <p class="hint">
        Elige receta para <strong>{{ day }} - {{ turn }}</strong>
      </p>

      <div class="selectors">
        <div class="field search">
          <label>Buscar</label>
          <div class="form-shell">
            <i class="bi bi-search"></i>
            <input
              type="text"
              [(ngModel)]="searchTerm"
              (input)="applyFilter()"
              placeholder="Ensalada, pasta, sopa..."
            />
          </div>
        </div>

        <div class="actions">
          <button
            class="btn-wk btn-pill btn-danger-wk"
            type="button"
            (click)="removeRecipe()"
          >
            Limpiar
          </button>
          <button class="btn-wk btn-soft btn-pill" routerLink="/planner">
            ← Volver al plan
          </button>
        </div>
      </div>

      @if (message) {
        <p class="msg">{{ message }}</p>
      }

      @if (loading) {
        <p>Cargando recetas...</p>
      } @else {
        <div class="recipes-grid">
          @for (r of filteredRecipes; track r.id ?? r.titulo) {
            <button
              class="recipe-pick"
              type="button"
              (click)="selectRecipe(r)"
              [disabled]="saving"
            >
              <div class="title">{{ r.titulo }}</div>
              <div class="desc">{{ r.descripcionCorta }}</div>

              <div class="meta">
                @if (r.tiempoPreparacionMin !== null) {
                  <span>⏱ {{ r.tiempoPreparacionMin }} min</span>
                }
                @if (r.categoriaNombre) {
                  <span>🏷 {{ r.categoriaNombre }}</span>
                }
              </div>
            </button>
          }
        </div>
      }
    </div>
  </div>
</section>
