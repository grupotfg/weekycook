<div class="py-3">
  <div class="row mb-4 align-items-center">
    <div class="col-md-7">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-end-0 text-muted">
          <i class="bi bi-search"></i>
        </span>
        <input type="text" 
               class="form-control border-start-0 ps-0" 
               placeholder="Buscar ingrediente por nombre..." 
               [(ngModel)]="searchText">
      </div>
    </div>
    <div class="col-md-5 text-end">
      <button class="btn btn-primary gradient-btn px-4" (click)="showForm = true" *ngIf="!showForm">
        <i class="bi bi-plus-lg me-2"></i>Nuevo Ingrediente
      </button>
    </div>
  </div>

  @if (showForm) {
    <div class="card bg-light border-0 shadow-sm mb-4 p-4 animate__animated animate__fadeIn">
      <h6 class="fw-bold text-purple mb-3">{{ isEditing ? 'Editar' : 'Añadir' }} Ingrediente</h6>
      <form (ngSubmit)="guardar()" class="row g-3">
        <div class="col-md-4">
          <label class="small fw-bold text-muted">Nombre</label>
          <input type="text" class="form-control form-control-sm" [(ngModel)]="selectedIng.nombre" name="nombre" required>
        </div>
        <div class="col-md-2">
          <label class="small fw-bold text-muted">Unidad</label>
          <select class="form-select form-select-sm" [(ngModel)]="selectedIng.unidadBase" name="unidad">
            <option value="gr">Gramos (gr)</option>
            <option value="ml">Mililitros (ml)</option>
            <option value="un">Unidad (un)</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="small fw-bold text-muted">Kcal (100g/ml)</label>
          <input type="number" class="form-control form-control-sm" [(ngModel)]="selectedIng.caloriasPorUnidad" name="cal">
        </div>
        <div class="col-md-4 d-flex align-items-end gap-2">
          <button type="submit" class="btn btn-sm btn-success px-4">Confirmar</button>
          <button type="button" class="btn btn-sm btn-secondary px-4" (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  }

  <div class="table-responsive">
    <table class="table table-hover align-middle shadow-sm bg-white rounded">
      <thead class="bg-light text-secondary small">
        <tr>
          <th>Nombre</th>
          <th>Unidad</th>
          <th>Kcal</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (ing of ingredientesFiltrados; track ing.id) {
          <tr>
            <td class="fw-bold text-purple">{{ ing.nombre }}</td>
            <td><span class="badge bg-light text-dark border">{{ ing.unidadBase }}</span></td>
            <td>{{ ing.caloriasPorUnidad }}</td>
            <td class="text-end">
              <button class="btn btn-sm text-primary me-2" (click)="editar(ing)" title="Editar">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn btn-sm text-danger" (click)="eliminar(ing)" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center py-5 text-muted">
              <i class="bi bi-search display-6 d-block mb-2"></i>
              No se encontraron ingredientes.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
